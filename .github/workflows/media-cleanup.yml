name: Deleted Account Media Cleanup Worker

on:
  schedule:
    # Run once daily at 04:00 UTC to purge deleted users' Cloudinary and R2 media well within the 30-day policy window
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  cleanup-deleted-user-media:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Media Cleanup Outbox
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://jorbites.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST "$APP_URL/api/media-cleanup/outbox" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --fail
