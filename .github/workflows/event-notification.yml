name: Event Notification Cron Job

on:
  schedule:
    # Run at 08:00 UTC daily
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-and-notify-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new events
        id: check-events
        env:
          JORBITES_URL: https://jorbites.com
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          DOM_TODAY=$(date -u +%-d)
          IN_3_DAYS=$(date -u -d "$TODAY + 3 days" +'%Y-%m-%d')
          echo "Checking for events starting on: $TODAY (Day of Month: $DOM_TODAY)"
          echo "Checking for events ending on: $IN_3_DAYS"

          # Fetch all events (using 'es' as source of truth, with translations for all supported locales)
          response=$(curl -s -f "$JORBITES_URL/api/events?lang=es&includeTranslations=true") || { echo "Failed to fetch events"; exit 1; }

          # Filter events starting TODAY (or recurrent events for today)
          STARTED_EVENTS=$(echo "$response" | jq --arg date "$TODAY" --arg dom "$DOM_TODAY" -c '
            [.[] |
              select(
                (.frontmatter.date != null and (.frontmatter.date | sub("T.*"; "") == $date)) or
                (.frontmatter.recurrent == true and (.frontmatter.dayOfMonth | tostring) == $dom)
              ) |
              {
                type: "NEW_EVENT",
                eventId: .slug,
                title: .frontmatter.title,
                title_es: (.titles.es // .frontmatter.title),
                title_en: (.titles.en // .frontmatter.title),
                title_ca: (.titles.ca // .frontmatter.title),
                description: (.frontmatter.description // ""),
                description_es: (.descriptions.es // .frontmatter.description // ""),
                description_en: (.descriptions.en // .frontmatter.description // ""),
                description_ca: (.descriptions.ca // .frontmatter.description // "")
              }
            ]
          ')

          # Filter events ending in 3 days (excluding recurrent and 1-day events)
          ENDING_EVENTS=$(echo "$response" | jq --arg date "$IN_3_DAYS" -c '
            [.[] |
              select(
                .frontmatter.endDate != null and
                (.frontmatter.endDate | sub("T.*"; "") == $date) and
                .frontmatter.recurrent != true and
                (.frontmatter.date | sub("T.*"; "")) != (.frontmatter.endDate | sub("T.*"; ""))
              ) |
              {
                type: "EVENT_ENDING_SOON",
                eventId: .slug,
                title: .frontmatter.title,
                title_es: (.titles.es // .frontmatter.title),
                title_en: (.titles.en // .frontmatter.title),
                title_ca: (.titles.ca // .frontmatter.title),
                description: (.frontmatter.description // ""),
                description_es: (.descriptions.es // .frontmatter.description // ""),
                description_en: (.descriptions.en // .frontmatter.description // ""),
                description_ca: (.descriptions.ca // .frontmatter.description // "")
              }
            ]
          ')

          # Combine events
          ALL_EVENTS=$(jq -n -c --argjson started "$STARTED_EVENTS" --argjson ending "$ENDING_EVENTS" '$started + $ending')

          COUNT=$(echo "$ALL_EVENTS" | jq length)
          echo "Found $COUNT events to notify."

          echo "events=$ALL_EVENTS" >> $GITHUB_OUTPUT

      - name: Send notifications
        if: steps.check-events.outputs.events != '[]'
        env:
          JORBITES_NOTIFIER_URL: ${{ secrets.JORBITES_NOTIFIER_URL }}
          JORBITES_NOTIFIER_API_KEY: ${{ secrets.JORBITES_NOTIFIER_API_KEY }}
          EVENTS_JSON: ${{ steps.check-events.outputs.events }}
        run: |
          if [ -z "$JORBITES_NOTIFIER_URL" ] || [ -z "$JORBITES_NOTIFIER_API_KEY" ]; then
            echo "Notifier secrets are missing. Skipping notifications."
            exit 0
          fi

          echo "$EVENTS_JSON" | jq -c '.[]' | while read -r event; do
            type=$(echo "$event" | jq -r '.type')
            eventId=$(echo "$event" | jq -r '.eventId')
            title=$(echo "$event" | jq -r '.title')
            title_es=$(echo "$event" | jq -r '.title_es // empty')
            title_en=$(echo "$event" | jq -r '.title_en // empty')
            title_ca=$(echo "$event" | jq -r '.title_ca // empty')
            desc=$(echo "$event" | jq -r '.description // empty')
            desc_es=$(echo "$event" | jq -r '.description_es // empty')
            desc_en=$(echo "$event" | jq -r '.description_en // empty')
            desc_ca=$(echo "$event" | jq -r '.description_ca // empty')

            echo "Sending $type notification for: $title"

            # Construct payload
            payload=$(jq -n \
              --arg type "$type" \
              --arg eventId "$eventId" \
              --arg title "$title" \
              --arg title_es "$title_es" \
              --arg title_en "$title_en" \
              --arg title_ca "$title_ca" \
              --arg desc "$desc" \
              --arg desc_es "$desc_es" \
              --arg desc_en "$desc_en" \
              --arg desc_ca "$desc_ca" \
              '{
                type: $type,
                metadata: {
                  eventId: $eventId,
                  title: $title,
                  title_es: $title_es,
                  title_en: $title_en,
                  title_ca: $title_ca,
                  description: $desc,
                  description_es: $desc_es,
                  description_en: $desc_en,
                  description_ca: $desc_ca
                }
              }')

            # Send notification
            response=$(curl -s -w "\n%{http_code}" -X POST "$JORBITES_NOTIFIER_URL/notifications" \
              -H "Content-Type: application/json" \
              -H "X-API-Key: $JORBITES_NOTIFIER_API_KEY" \
              -d "$payload")

            http_code=$(echo "$response" | tail -n1)

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
               echo "✓ Notification sent for $title"
            else
               echo "✗ Failed to send notification for $title"
               echo "Response: $(echo "$response" | sed '$d')"
            fi
          done
