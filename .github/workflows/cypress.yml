name: Cypress E2E Testing

on:
    workflow_run:
        workflows: ['Jest Unit Testing (API Routes & Server Actions)']
        types:
            - completed
    push:
        branches: main
    pull_request:
        branches: main

jobs:
    cypress:
        name: Cypress (${{ matrix.containers.name }})
        runs-on: ubuntu-latest
        environment: testing
        strategy:
            fail-fast: false
            matrix:
                containers:
                    - name: 'Recipes Spec'
                      spec: '__tests__/e2e/basic.cy.ts'
                    - name: 'Workshops & Quests Specs'
                      spec: '__tests__/e2e/workshops.cy.ts,__tests__/e2e/quests.cy.ts'
                    - name: 'User & Basic Specs'
                      spec: '__tests__/e2e/user.cy.ts,__tests__/e2e/app.cy.ts'
                    - name: 'Collaborative Recipes'
                      spec: '__tests__/e2e/collaborative_recipes.cy.ts'
                    - name: 'Drafts Management & Navigation'
                      spec: '__tests__/e2e/drafts_management.cy.ts,__tests__/e2e/drafts_navigation.cy.ts'
                    - name: 'Lists & Plannings Specs'
                      spec: '__tests__/e2e/lists.cy.ts,__tests__/e2e/plannings.cy.ts'
                    - name: 'Collaborative Roles & Invites'
                      spec: '__tests__/e2e/collaborative_roles_invites.cy.ts'
                    - name: 'Recipe Remix Spec'
                      spec: '__tests__/e2e/recipe_remix.cy.ts'
                    - name: 'Cooksnaps Spec'
                      spec: '__tests__/e2e/cooksnaps.cy.ts'
                      use_aws_emulator: true
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 11

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

            - name: Install dependencies with scripts disabled
              run: pnpm install --ignore-scripts

            - name: Install Cypress binary
              run: npx cypress install

            - name: Install & Start AWS Emulator
              if: matrix.containers.use_aws_emulator
              run: |
                  curl -fsSLo /tmp/aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
                  sudo apt-get update -qq && sudo apt-get install -y /tmp/aws-emulator.deb
                  EMULATOR_TELEMETRY=off aws-emulator --telemetry off -p 9297 > /tmp/aws-emulator.log 2>&1 &
                  for i in $(seq 1 30); do
                    if [ -f "$HOME/.aws/emulator/9297/ca.pem" ] && curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health > /dev/null; then
                      break
                    fi
                    sleep 1
                  done
                  curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health || { cat /tmp/aws-emulator.log; exit 1; }
                  CREDS_FILE="$HOME/.aws/emulator/9297/emulator_credentials"
                  AWS_ACCESS_KEY_ID=$(grep -E '^aws_access_key_id' "$CREDS_FILE" | head -n1 | cut -d'=' -f2- | xargs)
                  AWS_SECRET_ACCESS_KEY=$(grep -E '^aws_secret_access_key' "$CREDS_FILE" | head -n1 | cut -d'=' -f2- | xargs)
                  {
                    echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
                    echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
                    echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem"
                    echo "EMULATOR_TELEMETRY=off"
                    echo "R2_ACCOUNT_ID=emulator"
                    echo "R2_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
                    echo "R2_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
                    echo "R2_BUCKET_NAME=jorbites-remakes"
                    echo "R2_ENDPOINT=http://127.0.0.1:9298"
                    echo "R2_REGION=us-east-1"
                    echo "R2_FORCE_PATH_STYLE=true"
                    echo "R2_PUBLIC_DOMAIN=http://127.0.0.1:9298"
                    echo "NEXT_PUBLIC_R2_PUBLIC_DOMAIN=http://127.0.0.1:9298"
                  } >> "$GITHUB_ENV"

            - name: Start E2E S3 HTTP/CORS Proxy
              if: matrix.containers.use_aws_emulator
              run: |
                  npx tsx scripts/e2e-s3-proxy.ts > /tmp/e2e-s3-proxy.log 2>&1 &
                  for i in $(seq 1 30); do
                    if curl -sf http://127.0.0.1:9298/__proxy/health > /dev/null; then
                      break
                    fi
                    sleep 1
                  done
                  curl -sf http://127.0.0.1:9298/__proxy/health || { cat /tmp/e2e-s3-proxy.log; exit 1; }

            - name: Start MongoDB Replica Set
              run: |
                  docker run -d --name mongodb -p 27017:27017 mongo:6.0 mongod --replSet rs0 --bind_ip_all
                  until docker exec mongodb mongosh --eval 'db.adminCommand("ping")' > /dev/null 2>&1; do
                    echo "Waiting for MongoDB to accept connections..."
                    sleep 1
                  done
                  docker exec mongodb mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
                  until docker exec mongodb mongosh --eval 'rs.isMaster().ismaster' | grep -q 'true'; do
                    echo "Waiting for MongoDB replica set to become PRIMARY..."
                    sleep 1
                  done
                  echo "MongoDB Replica Set ready!"

            - name: Generate Prisma Client
              env:
                  DATABASE_URL: mongodb://localhost:27017/jorbites-test?replicaSet=rs0&directConnection=true
              run: npx prisma generate

            - name: Push Prisma Schema to MongoDB
              env:
                  DATABASE_URL: mongodb://localhost:27017/jorbites-test?replicaSet=rs0&directConnection=true
              run: npx prisma db push --skip-generate

            - name: Seed E2E Database
              env:
                  DATABASE_URL: mongodb://localhost:27017/jorbites-test?replicaSet=rs0&directConnection=true
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
              run: pnpm run seed:e2e

            - name: Create cypress.env.json
              env:
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
              run: |
                  USER_EMAIL="${CYPRESS_USER_EMAIL:-test@jorbites.com}"
                  USER_PASSWORD="${CYPRESS_USER_PASSWORD:-password123}"
                  echo "{
                    \"userTestEmail\": \"$USER_EMAIL\",
                    \"userTestPassword\": \"$USER_PASSWORD\"
                  }" > cypress.env.json

            - name: Cypress run
              uses: cypress-io/github-action@v7
              with:
                  install: false
                  build: pnpm run build
                  start: pnpm start
                  wait-on: 'http://localhost:3000'
                  wait-on-timeout: 120
                  config-file: cypress.config.ts
                  spec: ${{ matrix.containers.spec }}
              env:
                  DATABASE_URL: mongodb://localhost:27017/jorbites-test?replicaSet=rs0&directConnection=true
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
                  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'supersecretnextauthstring123456789' }}
                  NEXT_PUBLIC_SKIP_IMAGE_VALIDATION: true
                  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
                  NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
                  NEXT_PUBLIC_CLOUDINARY_API_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY || 'cypress-test-cloudinary-api-key' }}
                  REDIS_URL: redis://localhost:6379
                  REDIS_URL_CACHING: redis://localhost:6379
                  SKIP_ENV_VALIDATION: 'true'

            - name: Dump AWS Emulator & S3 Proxy logs on failure
              if: failure() && matrix.containers.use_aws_emulator
              run: |
                  echo "=== AWS Emulator Log ==="
                  cat /tmp/aws-emulator.log || true
                  echo "=== E2E S3 Proxy Log ==="
                  cat /tmp/e2e-s3-proxy.log || true
